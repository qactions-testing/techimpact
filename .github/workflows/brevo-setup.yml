name: Brevo setup

# Run once from Actions > "Brevo setup" > Run workflow. Safe to re-run.
# Renames the marketing@qactions.com sender to "QActions", creates the custom
# contact attributes and the "TechImpact · Leads" list. Needs secret BREVO_API_KEY.

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/brevo-setup.mjs
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
